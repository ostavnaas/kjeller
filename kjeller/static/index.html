<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kjeller</title>
<style>
  :root {
    --bg: #f5f5f4;
    --card: #ffffff;
    --text: #1c1917;
    --muted: #78716c;
    --border: #e7e5e4;
    --accent: #2563eb;
    --heat: #ea580c;
    --heat-soft: #ffedd5;
    --error: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917;
      --card: #292524;
      --text: #f5f5f4;
      --muted: #a8a29e;
      --border: #44403c;
      --accent: #60a5fa;
      --heat: #fb923c;
      --heat-soft: #431407;
      --error: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 system-ui, sans-serif;
  }
  header, main { max-width: 720px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 16px;
  }
  h1 { margin: 0; font-size: 22px; }
  a { color: var(--accent); text-decoration: none; }
  main {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }
  .room {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 16px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .room:last-child { border-bottom: none; }
  .name { font-weight: 600; text-transform: capitalize; }
  .temp { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .set { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
  .state {
    min-width: 72px;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .state.heating { color: var(--heat); border-color: var(--heat); background: var(--heat-soft); }
  .muted { color: var(--muted); font-size: 13px; }
  .footer { max-width: 720px; margin: 10px auto 0; text-align: right; }
  .error { color: var(--error); padding: 14px 18px; }
</style>
</head>
<body>
<header>
  <h1>Kjeller</h1>
  <a href="/config">Settings →</a>
</header>
<main id="rooms"><div class="muted" style="padding: 14px 18px">Loading…</div></main>
<div class="footer muted" id="updated"></div>

<script>
function roomRow(room) {
  const r = room.reading;
  const row = document.createElement("div");
  row.className = "room";

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = room.name;

  const temp = document.createElement("div");
  temp.className = "temp";
  temp.textContent = r && r.temperature !== null ? `${r.temperature.toFixed(1)}°` : "–";
  const set = document.createElement("span");
  set.className = "set";
  set.textContent = r ? `set ${r.target}°` : "waiting for update";
  temp.append(set);

  const state = document.createElement("div");
  state.className = "state";
  if (r && r.heating !== null) {
    state.textContent = r.heating ? "Heating" : "Idle";
    state.classList.toggle("heating", r.heating);
  } else {
    state.textContent = "Unknown";
  }

  row.append(name, temp, state);
  return row;
}

async function refresh() {
  const rooms = document.getElementById("rooms");
  try {
    const response = await fetch("/api/rooms");
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    rooms.replaceChildren(...data.rooms.map(roomRow));
    document.getElementById("updated").textContent = `Updated ${new Date().toLocaleTimeString([], { hourCycle: "h23" })}`;
  } catch (error) {
    const message = document.createElement("div");
    message.className = "error";
    message.textContent = `Could not load rooms: ${error.message}`;
    rooms.replaceChildren(message);
  }
}

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
