[project]
name = "kjeller"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi",
  "httpx",
  "pydantic",
  "pyyaml",
  "uvicorn",
]

[dependency-groups]
dev = [
  "ruff",
  "ty",
  "pyright",
  "types-pyyaml",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines are left to the formatter
